<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PokéScan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e4372c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>PokéScan</title>
<style>
:root{--bg:#10141f;--sf:#1a2032;--ink:#eef1fa;--mu:#98a2c0;--ln:#2c3550;--ac:#ff5a4d;--bl:#6f97ff;--ok:#44c585;--wa:#f0a928}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Helvetica Neue",sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
main{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
nav{display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:12px 4px;font:inherit;font-size:.85rem;font-weight:600}
nav button[aria-selected=true]{color:var(--ac)}
section[hidden]{display:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px;width:100%}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 14px;background:var(--bl);color:#0b1020}
.btn.r{background:var(--ac);color:#fff}.btn.g{background:var(--sf);color:var(--ink);border:1px solid var(--ln)}
.row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.row>*{flex:1}
.stage{position:relative;width:100%;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:3/4}
.stage video{position:absolute;inset:0;width:100%;height:100%}
#guide{position:absolute;border:3px solid var(--ac);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.45)}
.hint{color:var(--mu);font-size:.85rem;margin:6px 0}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.ct{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:6px;font-size:.78rem;display:flex;flex-direction:column;gap:4px}
.ct img{width:100%;aspect-ratio:63/88;object-fit:cover;border-radius:6px;background:var(--ln)}
.ct b{font-size:.82rem;line-height:1.15}.ct button{padding:6px;font-size:.8rem}
.q{display:flex;align-items:center;justify-content:space-between;gap:4px}
.q button{width:32px;height:32px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font-size:1.1rem}
.msg{padding:8px 10px;border-radius:8px;margin:4px 0;font-size:.88rem;background:#ff5a4d33}.msg.o{background:#44c58533}.msg.w{background:#f0a92833}
.stat{display:flex;gap:8px;margin:8px 0}.stat div{flex:1;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px}.stat b{display:block;font-size:1.3rem}
h2{margin:6px 0;font-size:1.15rem}
.tag{font-size:.7rem;color:var(--mu)}
</style>
</head>
<body>
<main>
<section id="scan">
 <div class="stage" id="stage"><video id="vid" playsinline muted autoplay></video><div id="guide" hidden></div></div>
 <p class="hint" id="shint">Inquadra la carta dentro al riquadro, con buona luce, poi premi “Leggi carta”.</p>
 <div class="row"><button class="btn r" id="go">Attiva fotocamera</button><button class="btn" id="snap" hidden>Leggi carta</button></div>
 <div class="row"><input id="q" placeholder="Oppure cerca per nome (es. Pikachu)" enterkeyhint="search"><select id="lang" style="flex:0 0 90px"><option value="it">IT</option><option value="en">EN</option></select></div>
 <div id="ocr" class="hint"></div>
 <div class="res" id="res"></div>
</section>
<section id="col" hidden><div class="stat" id="cs"></div><input id="cf" placeholder="Filtra la collezione"><div class="res" id="cl" style="margin-top:8px"></div></section>
<section id="deck" hidden>
 <div class="row"><select id="dsel"></select></div>
 <div class="row"><button class="btn" id="dn">Nuovo</button><button class="btn g" id="dr">Rinomina</button><button class="btn g" id="dd">Elimina</button></div>
 <div id="db"></div>
</section>
</main>
<nav><button data-t="scan" aria-selected="true">Scansiona</button><button data-t="col" aria-selected="false">Collezione</button><button data-t="deck" aria-selected="false">Mazzi</button></nav>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const API='https://api.tcgdex.net/v2/';
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={cards:{},sets:{},col:{},decks:[],cur:null};
try{const r=localStorage.getItem('pokescan');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('pokescan',JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const num=n=>/^\d+$/.test(n)?String(parseInt(n,10)):n;

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
 ['scan','col','deck'].forEach(i=>$('#'+i).hidden=i!==b.dataset.t);
 if(b.dataset.t!=='scan')stopCam();
 if(b.dataset.t==='col')renderCol();if(b.dataset.t==='deck')renderDeck();
});

/* ---------- database ---------- */
async function jget(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}
async function search(q,lang){
 const l=await jget(`${API}${lang}/cards?name=${encodeURIComponent(q)}`);
 return l.filter(c=>c.image).slice(0,40);
}
async function info(id,brief){
 if(S.cards[id])return S.cards[id];
 const d=await jget(`${API}en/cards/${id}`);
 let sc=S.sets[d.set.id];
 if(!sc){try{const s=await jget(`${API}en/sets/${d.set.id}`);sc=S.sets[d.set.id]={code:s.tcgOnline||d.set.id.toUpperCase(),name:s.name}}catch(e){sc={code:d.set.id.toUpperCase(),name:d.set.name}}}
 const c=S.cards[id]={id,name:brief?.name||d.name,nameEn:d.name,setId:d.set.id,setCode:sc.code,setName:sc.name,num:d.localId,
  img:(d.image||brief?.image||'')+'/low.webp',cat:d.category,stage:d.stage||'',etype:d.energyType||'',std:!!(d.legal&&d.legal.standard),mark:d.regulationMark||''};
 save();return c;
}
const isBasicEn=c=>c.cat==='Energy'&&c.etype==='Basic';
const grp=c=>c.cat==='Pokemon'?'Pokémon':c.cat==='Trainer'?'Trainer':'Energy';

/* ---------- camera + OCR ---------- */
let stream=null,worker=null;
async function startCam(){
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
  const v=$('#vid');v.srcObject=stream;await v.play();
  v.onloadedmetadata=layout;layout();$('#go').hidden=true;$('#snap').hidden=false;
 }catch(e){$('#shint').textContent='Fotocamera non disponibile: consenti l’accesso in Impostazioni > Safari, oppure cerca per nome.'}
}
function layout(){
 const v=$('#vid'),vw=v.videoWidth,vh=v.videoHeight;if(!vw)return;
 $('#stage').style.aspectRatio=vw+'/'+vh;v.style.objectFit='contain';
 const gw=Math.min(vw*.7,vh*.92*63/88),gh=gw*88/63,g=$('#guide');g.hidden=false;
 g.style.cssText+=`;left:${(vw-gw)/2/vw*100}%;top:${(vh-gh)/2/vh*100}%;width:${gw/vw*100}%;height:${gh/vh*100}%`;
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;$('#go').hidden=false;$('#snap').hidden=true;$('#guide').hidden=true}}
$('#go').onclick=startCam;
function crop(v,x,y,w,h,scale=2){const c=document.createElement('canvas');c.width=w*scale;c.height=h*scale;const g=c.getContext('2d');g.filter='grayscale(1) contrast(1.6)';g.drawImage(v,x,y,w,h,0,0,c.width,c.height);return c}
async function ocr(cv){
 if(!worker)worker=await Tesseract.createWorker('eng');
 return (await worker.recognize(cv)).data.text;
}
$('#snap').onclick=async()=>{
 const v=$('#vid'),vw=v.videoWidth,vh=v.videoHeight,gw=Math.min(vw*.7,vh*.92*63/88),gh=gw*88/63,gx=(vw-gw)/2,gy=(vh-gh)/2;
 const o=$('#ocr');o.textContent='Lettura in corso…';$('#snap').disabled=true;
 try{
  const nameTxt=await ocr(crop(v,gx+gw*.08,gy+gh*.025,gw*.62,gh*.1));
  const numTxt=await ocr(crop(v,gx,gy+gh*.88,gw,gh*.11));
  const m=numTxt.match(/(\d{1,3})\s*[\/7]\s*(\d{2,3})/)||numTxt.match(/\b(\d{1,3})\b/);
  const bad=/^(basic|base|stage|fase|evolves|evolve|trainer|energy)$/i;
  const words=(nameTxt.replace(/[^A-Za-zÀ-ÿ'\s-]/g,' ').split(/\s+/).filter(w=>w.length>=3&&!bad.test(w))).sort((a,b)=>b.length-a.length);
  const w=words[0];
  o.textContent=`Letto: ${w||'nome non chiaro'} ${m?m[1]+(m[2]?'/'+m[2]:''):''}. Se non è giusto, correggi nel campo di ricerca.`;
  if(w){$('#q').value=w;await doSearch(m?parseInt(m[1],10):null)}
 }catch(e){o.textContent='Lettura non riuscita (serve connessione internet). Riprova o cerca per nome.'}
 $('#snap').disabled=false;
};

/* ---------- search results ---------- */
let rt;$('#q').oninput=()=>{clearTimeout(rt);rt=setTimeout(()=>doSearch(null),500)};
async function doSearch(n){
 const q=$('#q').value.trim();if(q.length<2){$('#res').innerHTML='';return}
 $('#res').innerHTML='<p class="hint">Ricerca…</p>';
 try{
  let l=await search(q,$('#lang').value);
  if(n)l.sort((a,b)=>(parseInt(b.localId,10)===n)-(parseInt(a.localId,10)===n));
  $('#res').innerHTML=l.length?l.map(c=>cardHtml({id:c.id,name:c.name,img:c.image+'/low.webp',sub:c.localId+(n&&parseInt(c.localId,10)===n?' ✓':'')},`<button class="btn" data-a="add" data-id="${c.id}">+ Collezione</button>`)).join(''):'<p class="hint">Nessuna carta trovata.</p>';
  window._brief=Object.fromEntries(l.map(c=>[c.id,c]));
 }catch(e){$('#res').innerHTML='<div class="msg">Database non raggiungibile. Controlla la connessione.</div>'}
}
$('#lang').onchange=()=>doSearch(null);
const cardHtml=(c,extra)=>`<div class="ct"><img loading="lazy" src="${esc(c.img)}" alt=""><b>${esc(c.name)}</b><span class="tag">${esc(c.sub||'')}</span>${extra}</div>`;
$('#res').onclick=async e=>{const b=e.target.closest('button[data-a=add]');if(!b)return;b.disabled=true;b.textContent='…';
 try{await info(b.dataset.id,window._brief?.[b.dataset.id]);S.col[b.dataset.id]=(S.col[b.dataset.id]||0)+1;save();b.textContent='Aggiunta ('+S.col[b.dataset.id]+')'}catch(err){b.textContent='Errore'}
 b.disabled=false};

/* ---------- collection ---------- */
function qtyBox(id,map){return `<div class="q"><button data-a="m" data-id="${id}">−</button><b>${map[id]}</b><button data-a="p" data-id="${id}">+</button></div>`}
function renderCol(){
 const ids=Object.keys(S.col),tot=ids.reduce((a,i)=>a+S.col[i],0),f=$('#cf').value.toLowerCase();
 $('#cs').innerHTML=`<div><b>${tot}</b>carte</div><div><b>${ids.length}</b>diverse</div>`;
 const l=ids.map(i=>S.cards[i]).filter(c=>c&&(c.name+c.nameEn+c.setName).toLowerCase().includes(f)).sort((a,b)=>a.nameEn.localeCompare(b.nameEn));
 $('#cl').innerHTML=l.length?l.map(c=>cardHtml({...c,sub:`${c.setCode} ${c.num} · ${c.std?'Standard ✓':'Non Standard'}`},qtyBox(c.id,S.col))).join(''):'<p class="hint">Nessuna carta. Scansiona o cerca una carta e aggiungila.</p>';
}
$('#cf').oninput=renderCol;
$('#cl').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.id;
 if(b.dataset.a==='p')S.col[id]++;else{S.col[id]--;if(S.col[id]<1)delete S.col[id]}save();renderCol()};

/* ---------- decks ---------- */
const cd=()=>S.decks.find(d=>d.id===S.cur);
function renderDeck(){
 $('#dsel').innerHTML=S.decks.length?S.decks.map(d=>`<option value="${d.id}" ${d.id===S.cur?'selected':''}>${esc(d.name)}</option>`).join(''):'<option>Nessun mazzo</option>';
 const d=cd(),B=$('#db');
 if(!d){B.innerHTML='<p class="hint">Crea un mazzo con “Nuovo”.</p>';return}
 const ids=Object.keys(d.cards),cs=ids.map(i=>S.cards[i]).filter(Boolean);
 const n=ids.reduce((a,i)=>a+d.cards[i],0),msgs=[];
 if(n!==60)msgs.push(['',`${n} carte: ne servono 60.`]);
 const byName={};cs.forEach(c=>{if(!isBasicEn(c))byName[c.nameEn]=(byName[c.nameEn]||0)+d.cards[c.id]});
 Object.entries(byName).filter(([,v])=>v>4).forEach(([k,v])=>msgs.push(['',`${k}: ${v} copie, massimo 4.`]));
 if(!cs.some(c=>c.cat==='Pokemon'&&c.stage==='Basic'))msgs.push(['','Serve almeno un Pokémon Base.']);
 const ns=cs.filter(c=>!c.std);if(ns.length)msgs.push(['w',`Non legali in Standard: ${ns.map(c=>c.nameEn).join(', ')}.`]);
 if(!msgs.length)msgs.push(['o','Mazzo valido per Standard.']);
 B.innerHTML=`<div class="stat"><div><b>${n}/60</b>carte</div><div><b>${cs.filter(c=>c.cat==='Pokemon').reduce((a,c)=>a+d.cards[c.id],0)}</b>Pokémon</div></div>
 ${msgs.map(m=>`<div class="msg ${m[0]}">${m[1]}</div>`).join('')}
 <div class="row"><button class="btn r" id="ex">Esporta decklist</button><button class="btn g" id="ad">Aggiungi dalla collezione</button></div>
 <textarea id="ot" rows="8" hidden readonly></textarea><div class="row" id="eb" hidden><button class="btn" id="cp">Copia</button><button class="btn g" id="sh">Condividi</button></div>
 <div class="res" id="dl">${cs.sort((a,b)=>a.nameEn.localeCompare(b.nameEn)).map(c=>cardHtml({...c,sub:`${c.setCode} ${c.num}`},qtyBox(c.id,d.cards))).join('')}</div><div id="pk"></div>`;
 $('#ex').onclick=()=>{$('#ot').value=decklist(d);$('#ot').hidden=false;$('#eb').hidden=false};
 $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText($('#ot').value);$('#cp').textContent='Copiata'}catch(e){$('#ot').select()}};
 $('#sh').onclick=()=>navigator.share?navigator.share({title:d.name,text:$('#ot').value}):$('#ot').select();
 $('#dl').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.id;if(b.dataset.a==='p')d.cards[id]++;else{d.cards[id]--;if(d.cards[id]<1)delete d.cards[id]}save();renderDeck()};
 $('#ad').onclick=()=>{const l=Object.keys(S.col).map(i=>S.cards[i]).filter(Boolean).sort((a,b)=>a.nameEn.localeCompare(b.nameEn));
  $('#pk').innerHTML='<h2>Scegli dalla collezione</h2><div class="res">'+(l.length?l.map(c=>cardHtml({...c,sub:`${c.setCode} ${c.num} · ne hai ${S.col[c.id]}`},`<button class="btn" data-id="${c.id}">+ Mazzo</button>`)).join(''):'<p class="hint">Collezione vuota.</p>')+'</div>';
  $('#pk').onclick=e=>{const b=e.target.closest('button');if(!b)return;d.cards[b.dataset.id]=(d.cards[b.dataset.id]||0)+1;save();const y=$('main').scrollTop;renderDeck();$('#ad').click();$('main').scrollTop=y}};
}
function decklist(d){
 const g={'Pokémon':[],Trainer:[],Energy:[]};
 Object.keys(d.cards).map(i=>S.cards[i]).filter(Boolean).forEach(c=>g[grp(c)].push(c));
 return Object.entries(g).filter(([,l])=>l.length).map(([k,l])=>`${k}: ${l.reduce((a,c)=>a+d.cards[c.id],0)}\n`+l.map(c=>`${d.cards[c.id]} ${c.nameEn} ${c.setCode} ${num(c.num)}`).join('\n')).join('\n\n');
}
$('#dsel').onchange=e=>{S.cur=e.target.value;save();renderDeck()};
$('#dn').onclick=()=>{const n=prompt('Nome del mazzo:');if(!n)return;const d={id:uid(),name:n.trim(),cards:{}};S.decks.push(d);S.cur=d.id;save();renderDeck()};
$('#dr').onclick=()=>{const d=cd();if(!d)return;const n=prompt('Nuovo nome:',d.name);if(n){d.name=n.trim();save();renderDeck()}};
$('#dd').onclick=()=>{const d=cd();if(d&&confirm('Eliminare “'+d.name+'”?')){S.decks=S.decks.filter(x=>x!==d);S.cur=S.decks[0]?.id||null;save();renderDeck()}};

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
